[area.env_off.provenance]
source = "invented"
verified = """Ours, and it exists to answer ONE question with ONE variable. \
WORLDMAPS-W7 measured a DEPTH CUT on the client's own compiled meshes: ground at \
or below a threshold bracketed in (43, 47] stored units is absent from the \
