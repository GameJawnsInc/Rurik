(0x0070D9B2 `cmp cl,1` / 0x0070D9B7 / 0x0070D9BE `or eax,0x1000000`), so a file \
shipping 0 and a file shipping 1 both arrive at the selector as 1 and choose \
the SAME set. The boundary is 1-vs-2, not 0-vs-nonzero. 0x02 also keeps the \
`< 3` test at 0x0070D9DE on the same side as 0x00 does, so bit 5 of the \
in-memory dword is set in both arms and is not a confound.

