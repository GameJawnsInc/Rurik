# AUTHORED AREAS -- rung G.
#
# WHAT THE CLIENT WILL AND WILL NOT ACCEPT is written down in
# studies/worldmaps/AUTHORING.md -- the two map_flags levers and what each
# costs, the THREE slope classes (a map made only of 41-45 degree slopes
# compiles to its flat ground and nothing warns you), how to author a slope the
# snap does not move, prop footprints, and the gotchas that have each cost a
# run. Read it before adding a row.
#
# A `map` row in maps.toml says where a RETAIL map is and where you arrive in it.
# An `area` row says how to BUILD one of ours: the geometry, the surface, the
# weather, the ambience. `toolkit/mapdata/deploy.py` reads one of these rows and
# does the whole ladder in one command -- assemble, verify, install, launch.
#
# Every row here is `source = "invented"`, and that is the honest label rather
# than a formality: the geometry is ours, chosen rather than observed. What the
# row BORROWS is named per field (`donor_file_id`), and the borrowed bytes are
# read from the owner's own archive at run time and never stored here -- the
# same `borrowed_constants` pattern `mapbuild.py` has used since FINDINGS 14.
#
# WHAT A DONOR IS NAMED BY, and this changed on 2026-08-15 after it broke.
# These rows used to name their donor by ROW INDEX (`donor_row = 7982`), and a
# row index is meaningful only against the archive copy it was measured on --
# `mapchunks.py`:117 has said exactly that since it was written. Build 38833
# proved it: the update RECYCLED row 7982, so on a post-update archive that row
# is a 46,556-byte non-map (flags 3) while Pre-Searing Ascalon itself is alive
# and well at row 177262. Every area here would have refused to build against a
# current archive -- `deploy.py` fails closed, so this was a block rather than a
# wrong map, but a block on all three areas either way.
#
# The portable key is the FILE ID, so that is what these rows carry now.
# `deploy.py` resolves it against whichever archive it is installing into, and
# `donor_row`/`constants_row` are kept beside it as the 38797 answer, PRINTED
# when the resolution disagrees rather than trusted. Same correction, same day,
# as `maps.toml`'s Pre-Searing `file_id` -- and this file was missed when that
# one was fixed, which is why the note is long enough to be found next time.
#
# `map_id` points at a maps.toml row, which is what the SERVER serves. The two
# tables are deliberately separate: a map row is a fact about where something
# is, an area row is a recipe for making one.
#
# `reserve_bytes` -- OPTIONAL, AND IT IS THE ONE FIELD HERE THAT IS ABOUT THE
# ARCHIVE RATHER THAN ABOUT THE MAP (WORLDMAPS-W5, 2026-08-20). It is the
# reservation `deploy.py --install` asks `datalloc` for when it CREATES this
# area's chain: how many bytes of contiguous blocks the Stripped partner row is
# GIVEN, as against the `size` it HOLDS. The placement rounds it up to whole
# 512-byte blocks.
#
# WHY IT HAS TO BE STATED HERE AND NOT COMPUTED. A 24-byte MFT row is offset,
# size, extraBytes, flags, nextStream and crc -- there is no entitlement field,
# so once a row is written "what this row was given" survives nowhere on disk
# (`datwrite.py`'s `_grow_gate`: the bound "has to come from GEOMETRY").
# `deploy.resolve_rows` therefore recomputes a row's ceiling from its CURRENT
# size, and a created row's first install set that ceiling to exactly its own
# length -- zero headroom -- so the next, larger authored map was already past
# it and relocated. The area declares the budget once, and both directions of
# `deploy.py` honour it: creation asks for the blocks, and a later install that
# outgrows the row's current reservation grows back into them in place
# (`datwrite --grow-to`) instead of moving the row.
#
# IT IS ONLY SPENDABLE ON A ROW THIS TOOLKIT MADE, so it belongs on an area
# whose maps.toml row carries `created = true` and does nothing on any other.
# The reason is what `--grow-to` means: a statement about what a row was GIVEN.
# For a chain `deploy.py` allocated, this field IS that statement -- creation
# asked the allocator for exactly this many bytes. For a retail row we are
# displacing, ArenaNet gave that row whatever it gave it, and annexing the
# blocks behind it because OUR recipe declares a number would be inventing an
# entitlement rather than restating one. So `install_partner` requires both the
# budget and `created`, a displaced row fits-or-relocates exactly as it did
# before this field existed, and a run that declares a budget it cannot spend
# says so on the line where it relocates.
#
# IT IS AN AUTHORING BUDGET AND NOT A CLAIM ABOUT THE CLIENT. The client reads
# `size`, which is the payload and is unchanged; the reserved tail is zeroes,
# indistinguishable from the padding every block-rounded reservation has always
# carried. Nothing in this repo has ever observed the client caring, and this
# field asserts nothing about it. What it does cost is real: a contiguous free
# run that big has to exist in the target archive at creation time, and
# `datplan.classify_runs` is what decides that, per copy, on the day.
#
# Omit it and creation behaves exactly as it did before: reservation = the
# first install's own length, and the next larger map relocates.

[area.plaza]
name = "Plaza"
map_id = 143
dims = 32

# The geometry. `heights` selects a generator by name; `deploy.py --blend PATH`
# overrides it with a real Blender scene, which is rung G's headline path and
# needs no row change to use.
heights = "plaza"

# Where the flood seed goes, and where the player arrives. Both must stand on
# walkable ground -- deploy verifies the seed against the slope classifier and
# the spawn against the compiled mesh, because a seed on a steep cell makes the
# client build NO navmesh at all (FINDINGS 43, PathData:365).
seed_x = 1536.0
seed_y = 1536.0

# Everything below is BORROWED from one donor map, read at run time. 0x1B97D is
# Pre-Searing Ascalon: sunny morning grassland, birds and wind. Naming one donor
# rather than four keeps the map coherent -- its textures, its sun, its sky and
# its ambience agree with each other because they came from one place.
donor_file_id = 0x1B97D
donor_row = 7982          # the 38797 answer; a cross-check, not the lookup
# The STRUCTURAL constants -- Header and Zones -- come from a map shaped like
# ours, NOT from the biome donor. Zones is per-map: Pre-Searing's is 7,208 bytes
# against this reference map's 34, and borrowing it built an 11,115-byte map for
# a 4,608-byte reservation the first time this ran. Two fields, because one
# field invited the mistake.
constants_file_id = 0x22E2C
constants_row = 46196     # the 38797 answer; a cross-check, not the lookup
textures = true      # terrain dependency ids + table_a/table_b from the donor
sun = true           # angle_index from the donor's terrain, env sun byte to match
environment = true   # 0x10000009 + deps: sky, fog, ambient light, water
sound = true         # 0x10000012 + deps: ambient audio

# Props: how many trees to scatter, and the donor model to use. 0 disables.
trees = 5
# NO map_flags HERE, DELIBERATELY. WORLDMAPS-W11's water rule cannot touch this
# area: gen_plaza(32) tops out 31 units down and the rule needs 40, so 0 of its
# 1,024 cells are affected and the flag would be a no-op. It is also the control
# map for WORLDMAPS-W2's byte-identity witness, and setting a field that changes
# nothing about the mesh would still change the partner's bytes and stop that
# comparison reproducing. Left at 0 on purpose.

[area.plaza.provenance]
source = "invented"
verified = """The geometry, the seed and the tree placement are OURS -- chosen, \
not observed -- which is what `invented` means and why this row carries it. \
Everything the row borrows is named in a field beside it (`donor_row = 7982`, \
Pre-Searing) and is read from the owner's own archive at run time, never stored \
in this repo. The row was checked end to end by `deploy.py --area plaza`, which \
assembles the map, verifies the seed stands on walkable ground under the \
15/35/30 slope classifier measured in FINDINGS 48, verifies the spawn lands in \
exactly one trapezoid of the compiled mesh -- the same test every maps.toml row \
carries -- and then delivers it to an archive COPY and reads back what the \
client's own compiler produced."""

# The area that broke the size ceiling. Every map this toolkit authored before
# it was 32x32 for ONE reason, and the reason was never the format: the terrain
# codec caps at 16,777,216 cells, so 9,216 is not close to a limit. The cap was
# the ROW -- `datwrite` writes uncompressed and refuses to grow a reservation,
# so an authored map only fit where it was SMALLER than what ArenaNet had
# compressed into that row. 96x96 needs 22,016 B against map 143's 4,096, so
# installing this one RELOCATES the row (`datmove`) instead of replacing it.
[area.vale]
name = "The Vale"
map_id = 143
dims = 96
heights = "plaza"
seed_x = 4608.0
seed_y = 4608.0
donor_file_id = 0x1B97D
donor_row = 7982          # the 38797 answer; a cross-check, not the lookup
constants_file_id = 0x22E2C
constants_row = 46196     # the 38797 answer; a cross-check, not the lookup
textures = true
sun = true
environment = true
sound = true
trees = 12
map_flags = 1            # WORLDMAPS-W11: bit 0 ungates the navmesh water
                         # rule. Without it the client drops every triangle whose
                         # three corners are all 40+ units under water (the
                         # constant 40.0 at 0x0094DE30, tested at 0x0072D3ED),
                         # which costs this area 4,001 of 9,216 cells (43.4%).
                         # The top byte stays 0, so the 15/35/30 slope set
                         # FINDINGS 48 measured stays in force.
                         # FINDINGS 57's 88 trapezoids for this area was a flags-0, stored-install figure.

[area.vale.provenance]
source = "invented"
verified = """Ours, chosen rather than observed, like every area row. What this \
one adds over `plaza` is SIZE: at 96x96 the assembled map is 21,786 B against \
the 4,096 B its target row reserves, so it cannot be written in place and the \
install path must relocate the row. That is the whole point of the row -- it \
exercises the branch a 32x32 map never reaches. Verified offline: the terrain \
round-trips 9,216/9,216 samples exact, the seed stands on walkable ground, and \
the relocation was planned and executed against a throwaway archive copy with \
every open-time rule re-checked and no overlapping reservations afterwards."""

# Rung G's headline sentence, taken literally: a shape MODELLED IN BLENDER.
# `heights` is unused for this row -- `deploy --blend` overrides it -- and the
# row exists so the size, the seed and the borrowed set stay declarative.
[area.sculpt]
name = "Sculpted Vale"
map_id = 143
dims = 64
heights = "plaza"
# The plaza generator has a CLIFF built into it: at gx == mid the dip side
# (+4/cell) meets the rise side (-8/cell), a 168-unit step that measures 61
# degrees. The first seed here sat on that seam and `stripbuild` refused it,
# correctly. The centre is measured at 3 degrees.
seed_x = 3072.0
seed_y = 3072.0
donor_file_id = 0x1B97D
donor_row = 7982          # the 38797 answer; a cross-check, not the lookup
constants_file_id = 0x22E2C
constants_row = 46196     # the 38797 answer; a cross-check, not the lookup
textures = true
sun = true
environment = true
sound = true
trees = 8
map_flags = 1            # WORLDMAPS-W11: bit 0 ungates the navmesh water
                         # rule. Without it the client drops every triangle whose
                         # three corners are all 40+ units under water (the
                         # constant 40.0 at 0x0094DE30, tested at 0x0072D3ED),
                         # which costs this area 1,409 of 4,096 cells (34.4%).
                         # The top byte stays 0, so the 15/35/30 slope set
                         # FINDINGS 48 measured stays in force.
                         # WORLDMAPS-W8/W11 measured this area at flags 0 -- 64 trapezoids, mesh x 1248..6144, 2,582/4,096 = 63.04% -- twice on the probe copy.

[area.sculpt.provenance]
source = "invented"
verified = """Ours, and more literally ours than any other area row: the height \
field came out of a Blender mesh that was sculpted with a radial basin and a \
hard-crested ridge, not out of a Python formula. Verified by `deploy.py --area \
sculpt --blend`, which re-derives the lattice from the mesh's world positions, \
rounds and snaps onto the codec's reachable set with both errors reported, and \
checks the seed against the slope classifier before anything is written."""

# THE FIRST AREA THAT DOES NOT DISPLACE ANYBODY. Every row above rides map 143,
# i.e. MFT rows 71496/71497 -- a live retail area in the owner's own copy that we
# cannot name (FINDINGS 16-P7: there are ZERO provably-dead rows in the archive).
# That was never the goal; it was the only verb available, because `datwrite` and
# `datmove` both start from a row ArenaNet made. This row's map points at a file id
# that binds NOTHING, and `deploy.py --install` allocates the chain instead
# (WORLDMAPS-W3). Everything else here is deliberately unchanged from `sculpt`:
# same size, same donors, same seed, same borrowed set -- so the ONE thing that
# differs between a proven run and this one is where the rows came from.
#
# `map_id` NAMES THE MAPS.TOML ROW THAT CARRIES THE FILE ID, and that is why this
# row does not ride 143 like its neighbours. deploy joins area -> map row -> file
# id, so pointing this area at 143 would install it into the displacement row and
# the create branch would never fire. The map id ITSELF is still cosmetic -- 166 is
# a label the client already knows and prints over our terrain, exactly as
# maps.toml [map.143] and [map.144] say of theirs.
[area.frontier]
name = "The Frontier"
map_id = 166
dims = 64
heights = "plaza"
# The 64x64 centre, which is where `sculpt` puts its seed too and for the reason
# recorded there: the plaza generator has a 61-degree cliff at gx == mid, and the
# centre is measured at 3 degrees.
seed_x = 3072.0
seed_y = 3072.0
donor_file_id = 0x1B97D
donor_row = 7982          # the 38797 answer; a cross-check, not the lookup
constants_file_id = 0x22E2C
constants_row = 46196     # the 38797 answer; a cross-check, not the lookup
textures = true
sun = true
environment = true
sound = true
trees = 8

# THE HEADROOM THIS ROW IS GIVEN, and the header above is the whole rationale.
# 8,192 B is 16 blocks. WHERE THE NUMBER COMES FROM, said plainly because it is
# a choice rather than a measurement of this map: `deploy.install_bytes`' own
# measured series on build 38797's donors (2026-08-20) puts a 96x96 gen_plaza
# partner at 2,828 B of compression-8 stream -- 32x32 1,316 B, 64x64 2,012 B,
# 96x96 2,828 B -- so 8,192 is that largest measured figure with a 2.9x margin,
# and it comfortably holds a 96x96 compressed partner. It is NOT taken from a
# measured ladder above 96x96: no such series existed when this row was written
# (that is WORLDMAPS-W6), and `install_bytes` refuses to extrapolate its three
# points on principle -- the ratio is a property of the generator and the donor,
# not of the format. This area itself is 64x64 and installs 2,028 B, so the row
# is created with roughly 6.1 kB it does not yet use. It is spendable because
# this area's map row (166) carries `created = true` -- see the header: the
# three areas that ride map 143 are displacing a retail row and could declare
# this field to no effect.
reserve_bytes = 8192
map_flags = 1            # WORLDMAPS-W11: bit 0 ungates the navmesh water
                         # rule. Without it the client drops every triangle whose
                         # three corners are all 40+ units under water (the
                         # constant 40.0 at 0x0094DE30, tested at 0x0072D3ED),
                         # which costs this area 1,409 of 4,096 cells (34.4%).
                         # The top byte stays 0, so the 15/35/30 slope set
                         # FINDINGS 48 measured stays in force.
                         # WORLDMAPS-W4's witness -- 64 trapezoids from a created chain -- was at flags 0.

[area.frontier.provenance]
source = "invented"
verified = """Ours, chosen rather than observed, like every area row -- and what \
this one adds over `sculpt` is that the ROW ITSELF is ours: `map_id = 166` names a \
maps.toml row whose file id 0x5F0B0 binds nothing in any archive, so installing this \
area CREATES its two MFT rows through `datalloc` rather than overwriting a retail \
map's. Verified offline 2026-08-20 by `deploy.py --area frontier` against \
`vault/run/2026-07-29_221c13772c7a-c2/Gw.dat`: the 64x64 field round-trips \
4,096/4,096 samples exactly after the lattice snap, the assembled map is 10,714 B \
(9,843 generated, 770 borrowed) compressing to 2,028 B of compression-8 stream, and \
the seed measures 0.0 degrees under the 15/35/30 slope classifier from FINDINGS 48 \
-- `stripbuild` refuses `UnwalkableSeed` rather than emitting a map the client would \
build no navmesh for. The borrowed halves are named per field and read from the \
owner's own archive at run time, never stored here. `reserve_bytes` is an \
AUTHORING budget and is verified only as arithmetic: it is the largest measured \
compression-8 partner in `install_bytes`' 32/64/96 series (2,828 B at 96x96, build \
38797 donors, 2026-08-20) with a stated 2.9x margin, and no client has been asked \
anything about it -- the row it sizes declares `size`, the payload, exactly as it \
did before the field existed. It is spendable only because this area's map row is \
`created = true`: a budget declared on an area that DISPLACES a retail row buys \
nothing, deliberately, since what that row was given is ArenaNet's statement rather \
than ours. What is NOT verified is the \
CLIENT, twice over: the spawn-in-one-trapezoid test needs the mesh the client \
compiles (`deploy.readback`), and no retail client has ever read a created map chain \
at all. Both are WORLDMAPS-W4, which is a run rather than a check."""

[area.expanse]
name = "The Expanse"
map_id = 165
dims = 256
heights = "plaza"
# The rect's centre. default_rect(256,256) is (0,0,24576,24576), so the centre is
# (12288, 12288) -- grid cell (128,128), MEASURED at 0.0 degrees, which is the
# plaza generator's dead-flat apron. The same rule `sculpt` and `frontier` use,
# and for the same reason: the generator has a seam at gx == mid that steepens
# with distance (86.3 degrees at the rect edge at this size), and only the centre
# is guaranteed clear of it.
seed_x = 12288.0
seed_y = 12288.0
donor_file_id = 0x1B97D
donor_row = 7982          # the 38797 answer; a cross-check, not the lookup
constants_file_id = 0x22E2C
constants_row = 46196     # the 38797 answer; a cross-check, not the lookup
textures = true
sun = true
environment = true
sound = true
trees = 8
map_flags = 1            # WORLDMAPS-W11: bit 0 ungates the navmesh water
                         # rule. Without it the client drops every triangle whose
                         # three corners are all 40+ units under water (the
                         # constant 40.0 at 0x0094DE30, tested at 0x0072D3ED),
                         # which costs this area 32,321 of 65,536 cells (49.3%).
                         # The top byte stays 0, so the 15/35/30 slope set
                         # FINDINGS 48 measured stays in force.
                         # WORLDMAPS-W7's witness -- 60 trapezoids, 33,120/65,536 = 50.54% coverage -- was at flags 0, and that run's whole coverage model describes the flags-0 world.
# NO `reserve_bytes`, ON PURPOSE. W5's authoring budget is the obvious next thing
# to spend here and this row deliberately does not: a created row with a reserved
# zero tail has never been read by a client, and declaring one would make a red
# result at this size ambiguous between the size and the tail. The row takes its
# payload's own reservation -- 10 blocks, 5,120 B for a 4,912 B stream -- and
# `deploy` prints that it did.

[area.expanse.provenance]
source = "invented"
verified = """Ours, chosen rather than observed, like every area row -- and what \
this one adds over `frontier` is SIZE and nothing else: same generator, same two \
donors by file id, same prop count, same centre-seed rule, same created chain, \
same compression. 64x64 -> 256x256 is 16x the cells and 64x the 32x32 baseline. \
Verified offline 2026-08-20 against `vault/run/2026-07-29_221c13772c7a-c2/Gw.dat`: \
65,536/65,536 samples round-trip exactly after the lattice snap (worst sample \
moved 3), the assembled map is 142,374 B compressing to 4,912 B of compression-8 \
stream, assemble+compress is 0.74 s in CPython, and the seed measures 0.0 degrees \
-- `stripbuild` refuses `UnwalkableSeed` rather than emitting a map the client \
would build no navmesh for (FINDINGS 43, PathData:365). The borrowed halves are \
named per field and read from the owner's own archive at run time, never stored \
here.

WHAT THIS ROW'S SHAPE MEANS FOR ITS MESH, said here because it will otherwise \
read as a failure: `gen_plaza`'s dip side descends 4 units per cell without limit, \
and MEASURED 2026-08-20 on the client's own compiled 64x64 mesh, ground at or \
below a depth bracketed in (43, 47] stored units is ABSENT from the compiled \
navmesh -- 0 of 1,003 cells at +47 and deeper, against 63.6% at +43. At 32x32 the \
dip never reaches that depth and the mesh covers the whole rect; at 64x64 it \
crosses at Chebyshev ring 20 and 37% of the rect is gone; at 256x256 the same ring \
20 leaves roughly half the rect outside the mesh. That is a property of this \
generator, not of the size, and the mechanism -- water from the borrowed \
environment, a depth bound in the compiler, or the borrowed Zones chunk -- is \
NOT established."""

