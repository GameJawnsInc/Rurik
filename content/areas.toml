STATIC. No map has ever shipped a non-zero top byte, the inverted branch at \
0x0072CA92 has never been exercised by anything this project built, and \
studies/customarea FINDINGS 34 and 48 both record the mode flag's source as \
NOT FOUND. This row is the first time the other slope set is asked for."""

