# nine positions is which body slot -- studies/unitsetup/FINDINGS.md 8 Q6, the
# CONTESTED reading at studies/character/FINDINGS.md "Where every source is
# silent"). Same source, same honesty: UPSTREAM, one lineage's hand-written
# table, no capture of ours carries these bytes; OpenTyria is Unlicense, so the
# weakness is evidential, not legal. The client accepting the HAMMER is the only
# member of this family ever OBSERVED; if one of these refuses, watch file_id
