# THE BACKPACK, and it is a real ITEM rather than a bag the server conjures.
#
# `0x013F`'s trailing field is the container's own item id, nonzero on the type-1
# backpack and on NOTHING else, and 49 of 49 in the live corpus are an id declared
# by an `0x0161` in the SAME tape at the same timestamp. Sending that field as 0
# creates a container the inventory panel does not draw: the run on 2026-08-19
# (`20260819T160503`) got eight of the nine bags rendering and no Backpack, which
# is the first of the four item containers and the one the others sit under.
#
# WIKI (GWW, "Container", rev. 2026): "Every character's inventory has place for
# 1 Backpack, 1 Belt Pouch, 2 Bags and 1 Equipment Pack", the Backpack's default
# capacity is **20** -- matching the type-1 bag's slot count exactly -- and "the
# Backpack cannot be dragged away into another container or be destroyed". An item
# that cannot be removed is still an item, and the client wants it declared.
[item.backpack]
name = "Backpack (the first item container)"
file_id = 0x8001B536
item_type = 3               # bag/container
dye_tint = 1
dye_colors = 0
materials = 0
unk1 = 0
flags = 0x20001000
value = 5
model_id = 32
quantity = 1
enc_name = [0x21A8, 0xD157, 0xB58F, 0x166F]
modifiers = [0x24481400]

[item.backpack.provenance]
source = "capture"
capture = "20260819T132414"
origin = "live"
verified = """OBSERVED, and the strongest item row in this file. Every field is read \
off ArenaNet's own GAME_SMSG 0x0161 declaring the backpack container, and the row is \
CONSTANT: across the whole live corpus there is exactly ONE distinct backpack \
declaration -- 49 connections spanning FIVE distinct characters (character A, Redwar \
Tywin, character C, character D, character E) and three campaigns -- differing only in the \
per-connection item id, which is an arbitrary handle exactly as the bag ids and the \
0x0144 inventory key are. So the id is ours to allocate and everything else is theirs.

The extractor is `toolkit/authsrv/invcensus.py` (`bag_shapes()`), build 38833; the join \
is `0x013F` field 6 -> the `0x0161` declaring that id in the same tape. Cross-checked \
against a source that shares no code or ancestry with the capture: WIKI (GWW, \
"Container", rev. 2026) gives the Backpack a default capacity of 20, which is exactly \
the type-1 bag's slot count in every one of those 49 connections. Wiki and wire agreeing \
is real corroboration -- unlike two of our mirrors agreeing, which is one witness twice.

NOT decoded, and deliberately not guessed: `flags` 0x20001400 and the single modifier \
word 0x24470000. They go out verbatim because that is what retail sends. `enc_name` is \
the encoded string id, which is the pattern CLAUDE.md names -- commit the id, let the \
client resolve the text out of the owner's own archive."""

# THE COSTUME, and it exists to test ONE mechanism rather than to dress anybody.
#
# studies/playercomposite 9.2 read a costume-override path out of the client:
# equip slots 7/8 feed a registry keyed by file id, and at m_slotItemData
# build time (0x0082EFAA) a per-armour-slot override array at CpsBase+0xD8
# REPLACES the armour slot's fileId and flags with the costume's, forcing
# `flags |= 0x20000006`, while the costume's own dye bytes replace the
# armour's. Nothing in this repo could exercise it, because every item row we
# had is an armour type (4/7/13/16/19) and the override needs wire type 44 or
# 45. 9.8 recorded that gap; this row closes it.
#
# EVERY IDENTITY FIELD IS MEASURED, not chosen. Five different players in five
# captures declare this same item and agree on all of them; the ONLY field
# that varies between them is dye_colors (11, 4, 41, 2, 10), which is
# per-character. Note file_id's top bit is CLEAR here where our armour rows
# set it -- that bit is the deferred-fetch request (smsgnames 9), and retail
# does not set it for this item.
#
# FOUR FIELDS ARE OURS AND SAY SO: model_id, quantity, enc_name and modifiers
# are NOT measured, because retail declares this item through 0x015E
# (low detail) which carries none of them, and our sender uses 0x0161. They
# are set to the empty/neutral values a mechanism test wants -- an unnamed,
# unmodified costume. Anything that needs this item's real name must read it
# off a high-detail declare, and no capture in the vault has one.
[item.costume_body]
name = "costume body (wire type 44) -- the override probe"
file_id = 0x00000AF6        # record 2806, composite type 15 (the chest)
item_type = 44              # worn slot 7, n=97 in the corpus (test_wearmap 3)
dye_tint = 0
dye_colors = 11
materials = 0
unk1 = 0
flags = 0x20001006          # bit 2 set: ITEM_FLAG_COMPOSITE
value = 0
model_id = 0
quantity = 1
enc_name = []
modifiers = []

[item.costume_body.provenance]
source = "capture"
capture = "20260807T143055"
origin = "live"
verified = "25 declares of this item across five live captures (20260807T143055, 20260810T235916, 20260817T231139 x2, 20260818T132739); file_id, item_type, dye_tint, materials, unk1, flags and value identical in all five, dye_colors the only variable. Its record 2806 resolves to composite type 15 through cpsdata (toolkit/mapdata/cpsdata.py), which is what test_wearmap 4 pins for wire type 44"
note = "model_id, quantity, enc_name and modifiers are OURS and unmeasured -- retail declares this item low-detail (0x015E), which carries none of the four. The row exists to fire the 9.2 override path, not to reproduce a retail costume."

# THE COSTUME HEAD, and it is the OTHER half of 9.9's run question.
#
# 9.9 measured that a costume BODY (wire type 44) names the type-15 CHEST
# member of a five-record run ordered (14, 15, 16, 18, 17) and overrides
# members 0..3 -- boots, chest, gloves, legs -- leaving the head alone. This
# row is the head. Record 2654 is member 4 (type 17) of the run based at
# 2650, and it is deliberately a DIFFERENT run from costume_body's (2805):
# with both worn, the body's siblings and the head's must come from their own
# runs, so 2809 -- costume_body's own head member -- must NOT be fetched. That
# is the control that separates "the body walks members 0..3" from "the body
# walks the whole run and something else suppressed the head".
#
# THE CORPUS SPLITS TYPE 45 IN TWO and this row is the commoner kind: of the
# seven distinct type-45 ids in the vault, 2654/2784/3673 are member 4 of a
# run (record type 17, the hair/headgear component), while 2817 and 3350 are
# standalone type 19 records (component 1, the second head slot) and 3663/1887
# are type 17 outside any run. Only the member-4 kind is authored here; what
# the type-19 kind does is untested.
#
# Measured like its sibling: 12 declares in SIX captures, every field
# identical except dye_colors (10, 11, 9). Note dye_tint is 35 here where the
# body's is 0. The same four fields are OURS for the same reason -- retail
# declares it low-detail.
