what = "AgAgent's ARRIVAL TIMER CALLBACK -- not a per-frame update, which is what it was rowed as and what MEASUREMENT REFUTED (R4-A: 97 hits in 161.5 s = 0.62/s, against ~60/s for a 30 fps two-agent frame site). It is slot 1 of the two-entry vftable at 0x00A52F60 whose slot 0 is the scalar deleting destructor 0x005FE920, and it is dispatched by AgTimer::Advance. It carries the arrival test at 0x006001EB (`now == +0x48`, EXACT equality -- which is why it is timer-driven rather than polled) and the glide-vs-teleport branch at 0x0060029F."
