# --------------------------------------------------------------------------
# Added after run 3, 2026-08-27. Run 3 EXONERATED the teleport as the warp
# mechanism -- the client's own extrapolated position matched m_targetPoint to
# within 0.3 u on all 42 teleports, across keyboard interrupts. The operator
# still SAW 3-4 warps, so something else produces them, and the capture named
# the suspect: MapFindPath was called twice from 0x00605807 with range = 300.0f,
# which is the SNAP's gate 2. These two sites are what turn that into a ledger.
# --------------------------------------------------------------------------

[hook_site.snaptest]
va = 0x006055E0
rva = 0x002055E0
first_byte = 0x55
thiscall = true
deref_agent = true
# arg2 is the SOURCE agent -- the sync twin the test compares against. Capturing
# BOTH sides is what lets gate 1's separation be recomputed offline instead of
# inferred, because an entry hook cannot see which gate the function chose.
deref_agent_arg = 2
what = "the desync match test. Asks whether the SYNC agent's dead-reckoned position is within 100.0 u of the client's own history chain; on a miss it runs three fallback gates, ANY of which failing snaps -- straight-line separation vs 300.0f, MapFindPath returning pathCount == 0, and a step-clearance predicate."
why_hooked = "run 3 exonerated the teleport and proved this path RAN (two MapFindPath calls from its 0x00605807 with range 300.0f). Hooking it turns `the client snapped` into `the client snapped because gate N failed`."
[hook_site.snaptest.provenance]
