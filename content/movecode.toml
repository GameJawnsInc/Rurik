# --------------------------------------------------------------------------
# THE MapFindPath RETURN TAP, added 2026-08-29 (HANDOFF-PLANE.md §4.2). FOUR
# rows for one function, because the answer leaves by four doors.
#
# THE SECOND EMULATION SHAPE, and it is the first time this hook has needed one.
# Every site above is a `55 push ebp` entry, which is what let movehook emulate
# ONE instruction (PLAN.md §7 Q12(d)). These four are `C3 ret`, so they carry
# `shape = "ret"` and the handler emulates `eip = [esp]; esp += 4` instead.
# gensites.py refuses a byte that is not its own shape's, in BOTH directions.
#
# WHY THE ARGUMENTS ARE STILL READABLE AT A RET, which is what makes this cheap:
# all four exits are byte-identical `8B E5 5D C3` -- `mov esp,ebp / pop ebp /
# ret` -- so esp at the ret is EXACTLY the esp the entry hook saw, and
# [esp]=retaddr / [esp+4..24]=arg1..arg6 is bit-identical to the entry layout.
# That equality is also the JOIN KEY: one invocation's entry and ret records
# share (tid, esp), and a pair that disagrees refutes this paragraph rather than
# being a bad record. movehook stores `esp` on every record for exactly that.
#
# WHAT MUST NOT BE COPIED FROM THE ENTRY ROW, and it would have silently
# corrupted the capture: `deref_arg_b = 2`. The callee reuses the CALLER's arg2
# slot as FPU scratch -- `fstp dword ptr [ebp+0xc]` NINE times, the first three
# before any branch -- so at every ret [esp+8] holds a float, not the `to`
# pointer. 10000.0f is 0x461C4000 and 300.0f is 0x43960000, both plausible
# committed addresses in this 32-bit client, so readable() can ACCEPT one and
# hand back 16 bytes of unrelated memory as "the destination". Every row below
# therefore sets deref_arg_b = 0, and gensites REFUSES a ret row that does not
# (a row value alone is a promise; the refusal is the control). `to` is
# readable at the ENTRY only -- which is why the entry row stays.
#
# THE EXIT LIST IS COMPLETE AT FOUR, checked rather than assumed: a byte scan of
# all 581 body bytes finds five 0xC2/0xC3 and the fifth is a phantom inside
# `call 0x47f660`'s displacement; the linear decode closes to the byte on the
# eleven 0xCC of alignment padding at 0x0070A0D5. A missed exit would be a query
# that answered without being recorded -- a silent under-count.
#
# ONE THING THESE ROWS CANNOT DO. The function sets up no SEH frame, so a C++
# exception thrown by a solver callee would unwind past all four rets and the
# query would be recorded as unanswered. Nothing observed suggests it happens;
# it is stated because the exit list is otherwise exhaustive by construction.
# --------------------------------------------------------------------------

