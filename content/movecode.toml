extractor = "toolkit/clientscan/codescan.py"
build = 38797
verified = "--dis 0x006055E0 shows `55 push ebp`. Its call to MapFindPath is 0x00605802 (returning to 0x00605807) with maxCount=4 and range=300.0f, and the pathCount==0 test is `cmp [ebp-0x60],edi` / `je` at 0x0060580A-0x0060580D with edi provably 0. Its args are named by its own module's asserts: AgTrack:457 `state->clientControlled` at 0x0060560B, AgTrack:458 `source.GetWorld() == WORLD_SYNC` at 0x00605625."

[hook_site.reseed]
va = 0x006022B0
rva = 0x002022B0
first_byte = 0x55
thiscall = true
deref_agent = true
# arg1 is ANOTHER AGENT, not a point: 0x006022C0 loads it into edi and then reads
# [edi+0x24] (world), [edi+0x48] (m_timeStopMovement) and [edi+0x88..0x90]
# (m_segmentPoint). So this copies one agent's state onto another, and capturing
# only `this` records half of a correction.
deref_agent_arg = 1
what = "the correction itself. On a snap this reseeds EVERY agent in world 1, not just the one that diverged."
why_hooked = "the snap test says a correction was decided; this says one HAPPENED, and to whom. Without it a failed gate and an applied snap are the same record."
