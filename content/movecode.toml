va = 0x00600140
rva = 0x00200140
first_byte = 0x55
thiscall = true
deref_agent = true
# NO STRIDE. It was 64, sized for a per-frame assumption that RUN A REFUTED: the
# site fires 0.62/s, not the ~60/s a per-agent-per-frame update would give, so
# 1-in-64 stored 2 records out of 97 and cost R4-P2 most of its evidence. At this
# rate every hit is affordable -- 97 in 161 s against a 32,768 ring.
