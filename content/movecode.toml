[hook_site.resync]
va = 0x00605E40
rva = 0x00205E40
first_byte = 0x55
thiscall = true
deref_agent = false
what = "ResyncAllAsync -- a SECOND route to the roster reseed that calls snaptest ZERO times, so nothing it does passes a gate. Its loop is instruction-for-instruction agtrack's gated one (null check, test [eax+0x20],0x10000, Array:587 bounds assert, inline record clear, cmp esi,[edi+0x14] / setne bl for the i != focusId third argument)."
why_hooked = "§1s.1: 21 of the 53 reseeds in the whole movehook corpus -- 39.6% -- returned to 0x00605EF6, i.e. came through HERE and not through the gated loop. It was a no-op in that corpus (0 of 7 finite rows moved m_segmentPoint) but every one of those firings followed closely on a gated snap that had just glued the copies, so the corpus CANNOT see it firing cold. This site is the only instrument that can, and that is the residual risk to `the nine candidates were aimed at the right gate`."
