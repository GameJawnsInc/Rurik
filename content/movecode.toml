# --------------------------------------------------------------------------
# Added 2026-08-28 for the run FINDINGS.md §1s.9 asks for. THE PROPOSAL THERE
# NAMED FIVE ADDRESSES AND ONLY ONE OF THEM IS A LEGAL SITE -- read this before
# re-reading §1s.9 as a work order.
#
# `gensites.py` refuses any row whose first byte is not `0x55`, because the
# handler re-emulates ONE instruction shape (PLAN.md §7 Q12(d)). Re-read from
# the pinned 38797 image, the five were:
#
#   0x00606009  `0f 84` je        -- the AgTrack fence branch      REFUSED
#   0x00605634  `83 7b` cmp       -- the facing-9 first compare    REFUSED
#   0x00605683  `5e`    pop esi   -- the facing-9 return-1 tail    REFUSED
#   0x005FCAA0  `e8`    call      -- the ResyncAllAsync THUNK      REFUSED
#   0x005FEF70  `55`    push ebp  -- gate 3                        OK
#
# So four of the five would have failed at generation time. What replaces them
# is NOT a relaxed rule -- it is that three of the four wanted a VALUE the entry
# hooks can already reach, and the fourth wanted the thunk's target rather than
# the thunk:
#
#   the fence      -> read the dword the branch tests, AT the agtrack entry, on
#                     the same invocation that then branches on it (below)
#   the facing-9   -> both its operands (+0x48, +0xC4) sit on snaptest's arg2,
#                     which `snaptest` ALREADY dereferences; +0x48 is captured
#                     already, so this costs ONE new offset (`facing`)
#   ResyncAllAsync -> 0x00605E40, the body the thunk jumps to, which IS `55`
#   gate 3         -> unchanged
#
# That is 2 new sites and 2 new offsets, not 4 sites. It is also a better
# measurement: §1s.8 item 1's whole defect was that the fence was SAMPLED at
# 11.4 Hz by a classifier the outcome mutates. Reading the operand at the
# decision is the fix, and pairing agtrack against snaptest gives a second,
# independent route to the same count (see the runsheet).
# --------------------------------------------------------------------------

[hook_site.stepclear]
va = 0x005FEF70
