# --------------------------------------------------------------------------
# MOVECODE-B3's sites, added 2026-08-27 after run 1. All five are `push ebp`
# entries like the four above, so the handler still emulates ONE shape.
# --------------------------------------------------------------------------

[hook_site.mapfindpath]
va = 0x00709E90
rva = 0x00309E90
first_byte = 0x55
thiscall = false
deref_agent = false
# The query's coordinates are BEHIND POINTERS -- the client passes from/to by
# reference -- so a record that stores only the pointer values has nothing
# replayable in it. These name which args to dereference (16 bytes each) at
# capture time, guarded by readable(). 0 = none.
deref_arg_a = 1
deref_arg_b = 2
what = "the client's own navmesh query. __cdecl, SIX dword args, and NO meaningful return value -- all four exits are a bare `ret` and eax is leftover scratch. arg1 = from (point*), arg2 = to (point*, 16 B: float x, float y, int plane, int), arg3 = float range, arg4 = maxCount (an int, CONFIRMED by buffer arithmetic on both callers), arg5 = int* outCount, arg6 = point* outPath with a 16-byte stride."
why_hooked = "MOVECODE-Q2 and the whole of B3. Run 5 of the router arc found our pathmap decode reads open ground as a pocket; capturing every query the client makes and replaying it through our own route() turns that from an inference into a per-query measurement."
limits = "AN ENTRY HOOK CAPTURES THE QUESTION, NOT THE ANSWER. arg5 and arg6 point at UNINITIALISED caller memory at entry -- the results are written by the backends during the call. Scoring our route against the CLIENT's needs a second tap at the four `ret` sites (0x00709F0F, 0x00709F44, 0x0070A0AD, 0x0070A0D4). Replaying our own router over the captured queries needs only this."
[hook_site.mapfindpath.provenance]
source = "client-table"
extractor = "toolkit/clientscan/codescan.py"
build = 38797
verified = "--dis 0x00709E90 shows `55 push ebp`. Exactly 2 direct callers: 0x00605802 -- which IS the snap gate 2, whose pathCount==0 test is the `cmp [ebp-0x60],edi` / `je` at 0x0060580A-0x0060580D with edi provably 0 -- and 0x0081AF51 (click-to-move). arg4 = maxCount is confirmed by the out-buffer sizes closing exactly to the stack-cookie slot in BOTH frames: caller 1 asks 4 and reserves 4x16 at [ebp-0x44], caller 2 asks 9 and reserves 9x16 at [ebp-0x94], both ending at [ebp-0x04]. Two capacities, two frame sizes, both exact. Coordinates are the same world floats as m_point: the args come from 0x005FF820, which copies agent+0x88.. or recomputes from +0x78/+0x7C under assert AgAgent:974. Signature read from the body 2026-08-27: ecx is never read at entry (first use 0x00709EE7 WRITES it from arg6), all exits are bare `ret`, and no access to [ebp+0x20] or beyond. Point stride 16 from `shl edi,4` at 0x00709FDF indexing outPath."

