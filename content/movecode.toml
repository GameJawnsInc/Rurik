verified = "Read at 0x0060563A (`cmp dword [ebx+0xc4], 9`) inside snaptest, where ebx is arg2 (`mov ebx,[ebp+0xc]` at 0x006055F4) -- the agent snaptest already dereferences. It is the second half of an early-out that returns 1 = NO SNAP before any gate runs: 0x00605634 `cmp [ebx+0x48],0` / je past, then 0x00605641 `je 0x605683` where 0x00605683 is `pop esi / mov eax,1` -- so the condition is m_timeStopMovement != 0 AND facing == 9. m_timeStopMovement is captured already, so this one offset makes the early-out evaluable offline and needs no site. `facing` is OUR name: no ArenaNet assert names the field."
