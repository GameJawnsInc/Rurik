# --------------------------------------------------------------------------
# MOVECODE-R4, added 2026-08-28. THE INPUT-INDEPENDENT SAMPLING BACKBONE, and
# it is an INSTRUMENT row rather than a question row.
#
# WHY. Every disagreement in the R3 analysis pass reduced to one thing: this
# hook has no denominator that is independent of input. Its sites all fire on
# solver events, and record density therefore tracks how much the operator was
# doing -- FINDINGS §1u.5 is a worked example where two honest analyses of the
# same 12 events reached opposite signs purely by choosing different
# denominators, one giving a rate ratio of 1.05 and the other 11.0 over the same
# corpus. A denominator you get to choose is not a denominator.
#
# The movement tick runs per agent per frame regardless of what the player is
# doing, so its hit count is wall-clock exposure measured by the client's own
# clock. That makes every per-opportunity rate in this arc computable without a
# modelling choice.
#
# AND IT CLOSES §4 ITEM 2, OPEN SINCE B1. The tick is a C++ virtual: 0 direct
# rel32 callers, reached only by `call dword [reg+4]` after a vptr load, so
# `--xrefs` returns a zero indistinguishable from a dead function. §4 says in
# terms that "a breakpoint reading the return address settles it in one run;
# static analysis will not. That is a B2 site." This is that site, and the
# record already carries retaddr.
#
# THE STRIDE IS NOT OPTIONAL, and it is why `stride` exists at all. At ~30 fps
# over the two world copies an 8-minute run offers ~29,000 occurrences against
# NCAP 32768 -- and movehook's worker loop ENDS THE RUN when the ring fills, so
# an unstrided tick would cut the capture short and starve every other site of
# the rest of the session. `g_hits[]` counts every occurrence regardless, so the
# denominator is exact at any stride; only the stored sample is thinned.
# 64 keeps a full-length run at roughly a record every two seconds per agent.
# --------------------------------------------------------------------------

