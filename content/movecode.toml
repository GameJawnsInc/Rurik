[hook_site.agtrack]
va = 0x00605FC0
rva = 0x00205FC0
first_byte = 0x55
thiscall = true
deref_agent = false
# arg1 IS AN AGENT, established 2026-08-28 and not exploited before: 0x00605FC9
# loads it into edi, 0x00605FCE reads [edi+0x10] and BOUNDS-CHECKS it as an index
# (cmp against [esi+0x28], Array.h:587), and 0x00605FD1 reads [edi+0x24] and
# compares it against 1 at 0x00606013 to divert the local copy. Both are agent
# fields. This does NOT contradict the note at snaptest: agtrack pushes edi (the
# agent) then ebx (&record) at 0x00606011-12, so snaptest's arg1 is the 0x1C
# record and its arg2 is this same agent -- the two rows are consistent and the
# record is one frame further in.
deref_agent_arg = 1
# THE FENCE. 0x00606002 `cmp dword [eax+ecx*4], 0` where eax = [this+0x20] and
# ecx = id*7 dwords (lea ecx,[ebx*8] / sub ecx,ebx), i.e. a 0x1C stride -- then
# 0x00606009 `je 0x606103` skips EVERYTHING on zero. Reading that dword here, at
# the entry, on the same invocation that then branches on it, is what §1s.8 item
# 1 needs: its defect was that the fence was SAMPLED by movetap at 11.4 Hz
# against a median shut run of 13 samples, by a classifier the counted outcome
# mutates. This reads the operand at the decision instead.
deref_fence = true
what = "AgTrack dispatch, the desync/snap entry point. Its first branch is the per-agent `clientControlled` fence (0x00606009); past it, world == 1 is diverted at 0x00606016; only then is snaptest called at 0x0060601C."
why_hooked = "MOVECODE-Q4, ANSWERED -- 3 distinct return addresses over 759 entries, matching --xrefs. It stays armed for two NEW questions (2026-08-28): with `deref_fence` it counts fence EXECUTIONS rather than sampling fence state, and with arg1 dereferenced as an agent it captures the world field, which partitions every invocation into diverted / fence-shut / tested and gives a second independent route to the same fence count."
[hook_site.agtrack.provenance]
