note = """
WIKI (GWW "Fleshy" rev 2611793): non-fleshy creatures, Elementals among them,
are immune to Bleeding, Disease and Poison; GWW "Bleeding" rev 2673942 says the
same of Bleeding. So `fleshy = false` refuses all three. Bleeding is OBSERVED;
Disease and Poison ride the wiki alone -- their sentences, #1958 and #1959, are
on no wire we hold (NOT FOUND), so they go out only under --refusal-reasons.
The client's refusal block holds exactly those three immunity sentences, which
CORROBORATES the set.

Keyed by the MODEL FILE: RECONSTRUCTION. Definition 1415 (same capture, level 3,
scale 100%) declares the same file and inherits the row; no condition was tried
on it. Other non-fleshy families (spirits, undead, constructs) and effect-granted
immunity are NOT MODELLED -- mapping a family to its files needs data we do not
hold.
"""
