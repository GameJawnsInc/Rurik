# The per-map PARTY CAP: each served map's own `max_party`, read out of the client's
# area table (`s_missionClientData`, VA 0x0096DE38 on build 38797, 888 records, the
# structural and the code locators agreeing) with toolkit/clientscan/areatable.py.
# One row per served map -- content/maps.toml's slots -- because that is the join
# authsrv.py performs: `party_cap(state)` looks the instance's map id up here and the
# henchman add (c2s 0x009F) and the hero add (c2s 0x001E) refuse at the number
# (DESKWORK-D1, desk-partycap, 2026-09-25). Before this file the cap was ONE
# CONSTANT, 4 (authsrv.OUTPOST_PARTY_CAP), which was right for 148/146/242/449 and
# wrong for every 6- and 8-cap map the server can serve; `--constant-party-cap`
# restores that exactly, `--henchman-cap N` still overrides every map.
#
# WHY THE CLIENT'S NUMBER IS THE RIGHT ONE. The party window's counter is the client's
# own reading of this field: on 148 it drew "(2/4)" for the player and one hero
# (studies/deskwork/CONFIRM-2026-09-24.md section 2), and 148's row below reads 4; on
# retail's 242 (also 4) three henchman adds filled 1 -> 4 and nothing was attempted past
# it (studies/cmsg/FINDINGS.md "The party family"). CORROBORATED, two maps; the
# denominator's reader in the client is not traced here.
#
# A MAP WITH NO ROW falls back to the constant 4 and the server prints why, labelled
# UNVERIFIED for that map -- extract its row (below) rather than trusting the fallback.
#
# THE AUTHORED SLOTS (143, 144, 165, 166, 167, 168) reuse retail map ids as labels, so
# the cap here is the LABEL's: the client reads its area table by the map id it was
# told, and its panel will show that id's denominator. 143 (the Ascalon Academy slot)
# reads max_party 1 -- a solo map on retail -- so on that slot every add is refused
# and the panel says "(1/1)"; a run that needs a party there passes --henchman-cap.
#
# EVERY NUMBER IS BUILD 38797 and moves when ArenaNet ships. To regenerate:
#   python toolkit/clientscan/areatable.py --rows 0 --out vault/areatable/areatable.json
# and read rows[<map id>]["max_party"] (and ["min_party"], recorded beside it: 1 on every
# served row but 167/168, whose retail rows say 7 -- the server reads only max_party);
# test_henchparty section 5 re-reads every row below out of the pinned client when the
# vault holds it and goes red on a mismatch in either field.

[map_party_cap.148]
min_party = 1
max_party = 4
[map_party_cap.148.provenance]
source = "client-table"
extractor = "toolkit/clientscan/areatable.py"
build = 38797
verified = "s_missionClientData row 148 (Ascalon City, type 10), OFF_MAX_PARTY (+0x1C) = 4, OFF_MIN_PARTY = 1; areatable.py --out, both locators at VA 0x0096DE38; extracted 2026-09-25. The panel drew (2/4) here on 2026-09-24."

