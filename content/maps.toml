[map.194.provenance]
source = "opentyria"
verified = "MEASURED: 0x265F7 resolves to MFT row 64474, a map-flagged row."
note = """
NO SPAWN POINT IS KNOWN for this map. (0, 0) is a placeholder, not a coordinate, and
it has never been walkability-tested. Zoning here would put the body wherever (0,0)
happens to be, which for most meshes is off it. The file id is the verified part; the
spawn is not, and the two should not be read as carrying the same weight.
"""

