name over OUR terrain. That is not a claim about the content, and the area table names
no map file, so nothing joins the label to the file id except this row.

MFT SLACK IS THE BINDING CONSTRAINT, AND IT IS TIGHT. A map chain is two rows and the
MFT may grow only into the slack in its own last 512-byte block. MEASURED on the C2 copy
2026-08-20: 48 bytes = EXACTLY 2 rows, with 0 reusable USED-clear spares. So that copy
can take this chain and no other; a second created map there is refused by
`datalloc.plan_alloc`, correctly, and the remedy is a fresh copy rather than a
workaround. The 38833 archives have 424 bytes = 17 rows = eight authored maps.

WHAT IS STILL OPEN. No client has ever read a created MAP chain. A9 proved the retail
client resolves, decompresses and parses a chain `datalloc` created under a new file id,
but that chain was a model skeleton with real content on every stream -- never the
empty-head shape whose whole mechanism is that the client must COMPILE the map from the
partner. FINDINGS 36 item 4 names the case untested. WORLDMAPS-W4 is that run and the
run sheet is `vault/research/worldmaps/WORLDMAPS-W4-RUN.md`; until it comes back, this
row is an offline artifact and says so.
"""

