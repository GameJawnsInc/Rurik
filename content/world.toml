# Placement and player defaults: what stands where, and what the player starts with.
#
# The spawn table is the one that will grow. Today it holds a single test enemy placed
# relative to the player so that combat is exercisable at all; R4c's real spawns are
# server-only data that has to be captured, and none of it exists yet
# (PLAN.md section 1.7 names spawn placement as one of the four genuinely server-only
# things). When those arrive they are rows here, not code.

[spawn.test_enemy]
npc = "hatcher"
agent_id = 10
definition = 3
max_health = 100
# Placed relative to the player's arrival point rather than at an absolute coordinate,
# because the player's arrival point differs per map and this enemy is meant to be
# reachable in whichever one is loaded.
offset_x = 300.0
offset_y = 0.0
enabled = true
# Burrowing: the Plague Worm cycle, off by default. See [spawn.test_enemy.burrow].
burrow = false
burrow_out_seconds = 5.0
burrow_hidden_seconds = 4.0

[spawn.test_enemy.provenance]
source = "invented"
verified = ""
note = """
Ours, chosen rather than observed, and the row says so. There is no evidence that
anything stands 300 units east of the arrival point in any Guild Wars map. This exists
so that a hostile body can be hit, killed and revived on demand -- studies/enemy
records the repeatable cycle it supports.

`agent_id = 10` and `definition = 3` are allocator choices, not facts about the game.
studies/enemy/PLAN.md section 7.2 asks for a real agent table with allocated ids; when
that lands these two fields stop being constants and this row keeps only the placement.

max_health 100 is a placeholder matching the player's, so that damage arithmetic is
easy to read by eye during a fight. Absolute monster health is server-only data
(PLAN.md section 1.7) and nothing here has measured a Hatcher's.

BURROWING, added 2026-08-10, and the split of what is measured from what is chosen
matters more than the numbers.

`burrow_out_seconds` and `burrow_hidden_seconds` are INVENTED, like the rest of this
row, and they are the honest part of a mechanic whose other half is not. Live, these
are NOT periods: a Plague Worm stayed out 0.48-7.48 s (median 1.46) and hidden 1.6-6.9 s,
and two families sharing one model ran ~8-10 s and ~33 s cycles with distance from the
player failing to explain the split. 5.0 and 4.0 sit inside the observed ranges and are
otherwise ours. Do not read them as the game's.

The two numbers that ARE measured -- 2.00 s to emerge and 2.00 s to submerge, over 140
worm creates, with every sample inside +/-40 ms (emerge n=137 in [1.976, 2.021],
submerge n=132 in [1.973, 2.037]; the two n differ because a capture starts and ends
mid-cycle) -- deliberately did NOT come here. They are not
authorable: they are how long ArenaNet's server holds the transition effect bit before
and after the create/remove, which is protocol timing rather than a fact about this
particular creature, and this file's own header calls moving that kind of value here a
category error. They live in authsrv.py beside the opcode constants, cited.

A Hatcher is standing in for a worm. Nothing in Guild Wars says a collector burrows;
this row exercises the CYCLE, not the creature. The real worms' definition (1442, file
116366) was observed in our live capture and is deliberately not transcribed here --
importing an ArenaNet creature into tracked content is a judgement for the owner, and
the cycle is testable without it.
"""

# ---------------------------------------------------------------- the player

# The player's attribute ranks, as [attribute_id, rank] pairs.
#
# The IDS are measured -- they are the client's own `s_attrib` indices, read by
# toolkit/clientscan/attribtable.py, and 17..21 are exactly profession 1's
# (Warrior): Strength 17 (its primary), Axe Mastery 18, Hammer Mastery 19,
# Swordsmanship 20, Tactics 21. See studies/combat/PLAN.md section 10.
#
# The RANKS are ours. Nothing in the vault can source them: 0x003A appears 0
# times in 21,543 live GAME_SMSG, no c2s attribute-spend opcode was found in
# 52,778 decoded client messages, and there is no character-creation flow to
# take them from. So they are chosen, and the row says so.
#
# CHOSEN DISTINCT, and that is the one design decision worth keeping: with
# 12/9/6/3/1 no two attributes share a rank, so if the wire's triple slots were
# ever mis-ordered the attribute panel would show the numbers against the wrong
# names and a person could SEE it. A uniform spread would hide exactly that.
# Every value is <= 12, which is ArenaNet's own cap (AcctTemplate:441
# `data.attribValue[index] <= 12`, and CharData:202's bound of 13 on the
# s_attribPoints lookup).
#
# THE POINT BUDGET IS NOT MODELLED -- said out loud rather than left implied.
# We do not read the client's s_attribPoints cost table, we do not track spend,
# and 0x0037 goes out as [0, 0] because that is what all 8 live samples carry.
# Whether this spread is affordable at any level is a question this server
# cannot currently ask.
[player.attributes]
ranks = [[17, 12], [18, 9], [19, 6], [20, 3], [21, 1]]

[player.attributes.provenance]
source = "invented"
note = """
Ids measured from the client's s_attrib table (attribtable.py, build 38797);
ranks chosen. Replace the ranks the day a capture shows a real character's --
capture shopping-list item 1, studies/combat/PLAN.md section 3 -- and the ids
should survive that, because they are the client's own.
"""

[player.defaults]
energy = 25
health = 100
float_43 = 0.0396

[player.defaults.provenance]
source = "gw-preservation"
verified = """The PROPERTY IDS these values ride on were verified against our own \
binary, which is the part that mattered: our read of the int-record dispatch found \
cases for {32, 41, 42} and nothing else (studies/agentprops/FINDINGS.md section 3b), \
we had already MEASURED 42 as maximum health, and 41 is the only remaining slot in \
that dispatch and the one upstream calls energy. The float channel does have a real \
case for 43."""
note = """
The VALUES are weaker than the ids and should not be read as measured. 25 energy and
100 health are a starting character's, taken from gw-preservation's
gameservice/player.go:268-269, not observed on our wire.

float_43 = 0.0396 is worse still and is kept only because it travels with the pair
above in a server that works. gw-preservation's own comment next to it says "REVERSE
THIS MORE", so nobody upstream knows what it is either. Energy regeneration is the
obvious reading and it is a GUESS. If something ever depends on this number, measure
it first.
"""

# ------------------------------------------------- weapon and creature swing rates
#
# One row per weapon class. The client multiplies this by an attack-speed MODIFIER at
# 0x007F837E (`fld [esi+0xf0]; fmul [esi+0xec]`), and "unmodified" is 1.0 -- never 0,
# because the client asserts on a zero at both ends.

[attack_speed.rates]
axe = 1.33
daggers = 1.33
sword = 1.33
scythe = 1.5
spear = 1.5
hammer = 1.75
staff = 1.75
wand = 1.75
flatbow = 2.025
shortbow = 2.025
longbow = 2.475
recurve = 2.475
hornbow = 2.7
pet = 2.0
melee_minion = 3.1
bone_fiend = 1.86
unmodified_modifier = 1.0

[attack_speed.rates.provenance]
source = "wiki"
page = """GWW "Attack speed", section "Attack durations and effect of IAS and DAS", \
read 2026-08-06. The table says outright "These are the exact values used by the game"."""
verified = """A check that could have failed and did not: the client's own product \
reproduces the wiki's published IAS table exactly for three weapon classes and two \
modifiers -- 1.33/1.5/1.75 against 0.67 and 0.75 give 0.8911/1.005/1.1725 and \
0.9975/1.125/1.3125, six for six to four decimals. GWCA's Agent.h:181-182 \
independently names the same two offsets weapon_attack_speed and \
attack_speed_modifier and gives 1.33 for axe/sword/daggers, agreeing on both."""
note = """
WIKI (GWW, "Attack speed", section "Attack durations and effect of IAS and DAS", read
2026-08-06), whose table says outright "These are the exact values used by the game".

These are the rates the game uses, not rates we chose. A Hatcher's real swing rate is
not among them -- nothing has measured what a collector swings at -- so any code
standing an axe's 1.33 in for a monster is using a labelled placeholder.
"""

# ---------------------------------------------------------------------------
# AREA POPULATIONS -- what lives in a zone this toolkit authored.
#
# A row carrying `area` belongs to that authored area and is served by
# `authsrv --area NAME`, which REPLACES the single global test enemy above
# rather than adding to it: that one is placed by offset from the player, so in
# a zone with its own idea of what stands where it would appear in the middle
# of the arrangement.
#
# THE COORDINATES CAME OUT OF THE COMPILED NAVMESH, not off a screenshot, and
# that is the whole reason this could not have been written before rung (I).
# The sculpt map is **1.2% walkable by area** -- 13 trapezoids over a 64x64
# map, because a Blender basin and a hard-crested ridge leave most of the
# terrain steeper than the client's own walkable band. Picking a spot by eye
# gives ground about one time in eighty. Each position below is the CENTRE of a
# trapezoid the client itself built from our terrain, and the server re-checks
# every one against the mesh before a body goes out -- a position that is not
# ground is refused rather than placed, because a body standing where the
# server's own collision says nothing exists makes everything downstream reason
# about it wrongly.
#
# `definition` may be shared by rows naming the SAME npc and never by rows
# naming different ones; `agent_id` is unique always. Both are allocator
# choices, like the ones above, and are deliberately clear of the probes
# (agents 2..7, definition 2) and of `test_enemy` (agent 10, definition 3).

[spawn.sculpt_watcher]
area = "sculpt"
npc = "hatcher"
agent_id = 20
definition = 5
max_health = 100
# Trapezoid 10's centre, 140 units from the arrival point -- the body you see
# without turning round. Probe bodies placed far out read as "nothing appeared".
x = 2934.0
y = 3046.5
allegiance = "noncombatant"
attacks_back = false
enabled = true

[spawn.sculpt_watcher.provenance]
source = "invented"
verified = """Ours, chosen rather than observed, like every placement in an \
authored area. What is NOT invented is that the spot is standable: (2934, \
3046.5) is the centre of trapezoid 10 of the navmesh the retail client compiled \
from our own terrain, read back out of the archive after the run that built it, \
and the server re-checks it against that same mesh before creating the body. \
The npc template it names carries its own provenance in npcs.toml."""

[spawn.sculpt_hostile]
area = "sculpt"
npc = "hatcher"
agent_id = 21
definition = 5              # same template as the watcher, so one definition
max_health = 100
# Trapezoid 1's centre, ~478 units out: something to walk toward across ground
# that is walkable at both ends and mostly not in between.
x = 2618.6
y = 2921.0
allegiance = "hostile"
attacks_back = true
enabled = true

[spawn.sculpt_hostile.provenance]
source = "invented"
verified = """Ours. The position is trapezoid 1's centre in the client-compiled \
navmesh, chosen because it is walkable, roughly 478 units from the arrival \
point, and separated from it by terrain that is not -- which is what makes it a \
test of the ground rather than of the spawn. Shares `definition` with \
sculpt_watcher deliberately: both are hatchers, a definition is per-instance and \
outlives the agents using it (ArenaNet sends one for 140 re-creates of one \
worm), and this exercises the rule that sharing is allowed within a template."""

[spawn.sculpt_farside]
area = "sculpt"
npc = "hatcher"
agent_id = 22
definition = 5
max_health = 100
# Trapezoid 7, ~654 units. Three bodies rather than two so the population is
# visibly a SET -- a pair can be produced by code that handles exactly two.
x = 2595.5
y = 3520.0
allegiance = "hostile"
attacks_back = false
enabled = true

[spawn.sculpt_farside.provenance]
source = "invented"
verified = """Ours; trapezoid 7's centre in the client-compiled navmesh. It \
exists so the area holds THREE bodies rather than two -- a population of two is \
satisfied by code that handles exactly two, and the count is the claim here. \
`attacks_back = false` so that one of the two hostiles is passive, which keeps \
a run readable when both are in aggro range at once."""
