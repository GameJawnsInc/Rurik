(316-323) stays the probe bar and --skills still overrides."""

[player.defaults]
energy = 25
health = 100
float_43 = 0.0396

[player.defaults.provenance]
source = "gw-preservation"
verified = """The PROPERTY IDS these values ride on were verified against our own \
binary, which is the part that mattered: our read of the int-record dispatch found \
cases for {32, 41, 42} and nothing else (studies/agentprops/FINDINGS.md section 3b), \
we had already MEASURED 42 as maximum health, and 41 is the only remaining slot in \
that dispatch and the one upstream calls energy. The float channel does have a real \
case for 43."""
note = """
The VALUES are weaker than the ids and should not be read as measured. 25 energy and
100 health are a starting character's, taken from gw-preservation's
gameservice/player.go:268-269, not observed on our wire. This row is the BASE
world's level-1 character and the fixture forty offline locks read; an optional
`level` here (default 1) is the starting level when no store row carries one.
The slice's level-3 character overrides health, level and ranks at launch from
[party.slice] (SLICE-H8).

float_43 = 0.0396 is worse still and is kept only because it travels with the pair
above in a server that works. gw-preservation's own comment next to it says "REVERSE
THIS MORE", so nobody upstream knows what it is either. Energy regeneration is the
obvious reading and it is a GUESS. If something ever depends on this number, measure
it first.

UPDATE 2026-08-20 -- MEASURED, and the guess was right. Property 43 is energy
regeneration as a FRACTION OF MAXIMUM ENERGY PER SECOND, read off the one death in
the live corpus: the same character carried 0.0528f at 25 max energy and 0.0600f at
22, and 0.0528 x 25 = 0.0600 x 22 = 1.32 energy/s exactly -- the pool shrank under a
death penalty and the absolute rate did not move.

AND THIS ROW'S OWN NUMBER IS IN THE CORPUS. `moralescan.py --pips` joins every
property-43 sighting to its agent's property-41 maximum: 0.0396 at a 25 maximum
appears 4 times on ArenaNet's own wire, bit-exact, and is 3 pips at 0.33 -- a
Ranger's, per GWW's basic-armor table. So the value gw-preservation shipped and
nobody upstream could explain is retail's, and the source line above understates
what backs it. The row keeps `source = "gw-preservation"` because that is where WE
got it; the corroboration is recorded here rather than by rewriting history. GWW ("Energy", "Regeneration and
degeneration") gives one pip as 1 energy per 3 seconds, so 1.32/s is four pips at
0.33 each, and THIS row's 0.0396 is 3 x 0.33 / 25: three pips on a 25-energy
character. Nobody upstream knew what it was; it was never mysterious, only
unlabelled. studies/morale/FINDINGS.md section 2.3.
"""

# ------------------------------------------------- morale, and the death penalty
#
# Morale is a percentage with 100 as neutral. It scales the character's BASE health and
# energy -- not the totals -- and a death is -15 of it. Everything here is the RULE
# layer; the wire layer (which opcodes carry it) is in authsrv.py and the evidence for
# both is studies/morale/FINDINGS.md.

[player.morale]
baseline = 100
floor = 40
ceiling = 110
death_step = 15
xp_per_percent = 75
resurrection_grace = 14
base_energy = 20
base_health_level_1 = 100
health_per_level = 20

[player.morale.provenance]
source = "wiki"
page = """GWW "Death Penalty" (sections Definition, Acquisition, Counters), "Morale \
Boost" (Definition, Notes), "Health" (Maximum health) and "Energy" (Maximum energy, \
Regeneration and degeneration), all read 2026-08-20."""
verified = """OBSERVED against ArenaNet's own wire, and the check could have failed: \
the one player death in the live corpus (20260817T183756, agent 27, t=78.813) carries \
morale 100 -> 85 on two channels at once, and BOTH maxima move by exactly what these \
numbers predict. Health 120 -> 102 is level 2's base 120 (= base_health_level_1 + \
health_per_level) less 15%. Energy 25 -> 22 is base_energy 20 less 15%, subtracted \
from a 25 total -- which is the discriminating one, because scaling the TOTAL gives \
21.25 and no rounding rule reaches 22 from there. The floor and ceiling are corroborated \
from a second lineage that shares no ancestry with the wiki: GWCA's PlayerAttrSet \
annotates morale_percent "Ranges from 40 to 110"."""
note = """
base_health_level_1 and health_per_level are GWW's published progression ("start at
level 1 with 100 health. This increases at 20 health per level up to a maximum of 480
health at level 20"), so base health is 100 + 20 x (level - 1). base_energy is the
innate 20 every profession has regardless of level; the +5/+10 from basic armor is
real total energy but is NOT scaled by morale, which is what the wire measurement above
shows and what GWW says outright: a boost "is not applied to energy or health from
equipped armor or weapon sets".

xp_per_percent is the PvE counter -- 75 experience removes 1% of death penalty. The PvP
counter (killing an enemy player removes 2% per living teammate) is deliberately absent:
this server has no PvP and inventing the row would put an unreachable rule in the world.

resurrection_grace is the one exception a player would actually notice at the keyboard:
GWW's "Death Penalty" lists "Dying shortly after resurrection (5 seconds in PvP, 14 in
PvE)" among the deaths that never incur a penalty. So a party that is being wiped repeatedly
does not spiral -- the second death inside the window is free. 14 is the PvE figure and
the only one here, for the same reason the PvP counter is absent.

WHAT THIS ROW DOES NOT DECIDE: whether a death costs anything at all. That is the map's
question, and pre-Searing -- every map this server ships -- never charges one. See the
map_rule rows in content/maps.toml.

CORROBORATED the same day from the opposite direction (the energy arc, blind to
the death-tick derivation above): ALL FIVE distinct property-43 values in the
live corpus fit f32(0.33) * pips / max BIT-EXACTLY while the wiki's nominal 1/3
energy per second fits none of them, the (pips, max) pairs are exactly GWW's
basic-armour rows, and this row's 0.0396 (f32 0.03959999978542328) appears on
ArenaNet's own wire in capture 20260810T235916 on four connections -- three
pips, a Ranger's. Two derivations, no shared code path, one constant.
studies/skills/FINDINGS.md section 23. The pip count 3 rides with max 25 as a
pair; change either only together.
"""

