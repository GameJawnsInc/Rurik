#
# THE BARS (SLICE-B3, 2026-09-12). [[id, activation, recharge]] per slot,
# the client's own row values. Raiders: Sever Artery 382 (Bleeding),
# Power Attack 322 (+ Damage), Healing Signet 1 (self-heal) -- warrior skills
