# ------------------------------------------------------------------ portals
#
# SLICE-B8: WHERE A MAP HANDS THE PLAYER TO ANOTHER. A portal is a circle on
# one map; a player who was outside it and walks in is transferred to
# `to_map` -- `0x0028 -> 0x01A5 -> 0x0099` and a graceful close, which is what
# ArenaNet's server does unprompted in 34 of the corpus's 41 transfers
# (studies/slice/FINDINGS.md SLICE-F8). The trigger, the circle and its place
# are OURS: retail's portal geometry is not in any capture this repo holds.
#
# THE SLICE'S EXIT: Ascalon City (148) -> the corridor (168), 500 u WEST of
# the arrival point on ground `pathmap` measures walkable (9326, 8077: True;
# 500 u east is not), so a player arriving at (9826, 8077) is outside the
# circle and has to walk in. The way back sits at the corridor's south end,
# 736 u short of its arrival point, so it too must be walked into.
#
# THE MILESTONE PAIR PLAN.md section 5 names -- 148 <-> Lakeside County (146),
# the same file id and the same arrival point, one byte of is_explorable apart
# -- is kept 500 u NORTH of the arrival point (also measured walkable): it is
# the hop SLICE-F17 proved on a client, and it stays runnable as the control.

