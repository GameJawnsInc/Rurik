# ---------------------------------------------------------------------------
# THE ERRAND: the quest's own two NPCs, as CONTENT. SLICE-B1, 2026-09-12.
#
# content/quests.toml has said since it was written that its `giver_agent = 99`
# and `objective_agent = 98` "bind to the probe world rather than to characters
# in a place", and the recon that opened this arc reported the consequence as
# "no code spawns a quest giver in ordinary play". Both are true and neither
# needed a server change: `_quest_lines` and `_objective_quests` bind by AGENT
# ID, and `area_population` lets a spawn row choose any id. A row IS the giver.
#
# THE IDS ARE DELIBERATELY THE PROBE'S OWN, 99 and 98. The quest row keeps its
# numeric columns alongside the new `giver_spawn`/`objective_spawn` keys and the
# two agree by construction, so `probequest.py`'s hand-built world and this
# authored one address the same bodies and neither had to be changed to suit the
# other.
#
# POSITIONS: both MEASURED walkable on map 146/148's own navmesh (they share
# file 113021). The scout sits 950 u out so "follow the arrow to my companion"
# is an actual walk rather than a turn on the spot; the giver is 300 u from the
# arrival point, close enough to find without being on top of the player.

[spawn.errand_giver]
area = "errand"
map = 148                 # the outpost. A spawn row may say which map it is FOR
                          # (SLICE-B8): one process serves several maps now, and
                          # "errand" has no [area.*] row to carry a map_id.
npc = "lieutenant_fisk"
agent_id = 99
definition = 50
# 200 u, INSIDE the 250 u INTERACT_RANGE, and that is a content decision rather
# than a convenience. At 300 u the first run put the giver beyond range, so the
