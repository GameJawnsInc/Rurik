# AREA POPULATIONS -- what lives in a zone this toolkit authored.
#
# A row carrying `area` belongs to that authored area and is served by
# `authsrv --area NAME`, which REPLACES the single global test enemy above
# rather than adding to it: that one is placed by offset from the player, so in
# a zone with its own idea of what stands where it would appear in the middle
# of the arrangement.
#
# THE COORDINATES CAME OUT OF THE COMPILED NAVMESH, not off a screenshot, and
# that is the whole reason this could not have been written before rung (I).
# The sculpt map is **1.2% walkable by area** -- 13 trapezoids over a 64x64
# map, because a Blender basin and a hard-crested ridge leave most of the
# terrain steeper than the client's own walkable band. Picking a spot by eye
# gives ground about one time in eighty. Each position below is the CENTRE of a
# trapezoid the client itself built from our terrain, and the server re-checks
# every one against the mesh before a body goes out -- a position that is not
# ground is refused rather than placed, because a body standing where the
# server's own collision says nothing exists makes everything downstream reason
# about it wrongly.
