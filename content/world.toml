# Placement and player defaults: what stands where, and what the player starts with.
#
# The spawn table is the one that will grow. Today it holds a single test enemy placed
# relative to the player so that combat is exercisable at all; R4c's real spawns are
# server-only data that has to be captured, and none of it exists yet
# (PLAN.md section 1.7 names spawn placement as one of the four genuinely server-only
# things). When those arrive they are rows here, not code.

[spawn.test_enemy]
npc = "hatcher"
agent_id = 10
definition = 3
max_health = 100
# ARMOUR RATING is DERIVED, not declared -- see creature_armor_rating() in
# authsrv.py. It was `60` for one commit, chosen because that is the Isle's own
# Suit baseline, and 60 is level-20 armour on a level-1 creature: the wrong
# SHAPE, which is exactly the failure studies/monsterai section 3.3 already paid
# for on reach. WIKI (GWW, "Armor rating", rev. 2026) gives the formula --
# `creature AR = 3 * Level + armor bonus`, the bonus being profession-specific
# -- so this row already carries everything needed: the npc's `level` and
# `profession`. A number derived from two facts we hold beats a third fact
# invented beside them.
#
# Uncomment to OVERRIDE, which the same page says is often right: "Many
# creatures in PvE do not follow this formula and may be significantly
# resistant or vulnerable to certain types of damage." An override is a
# measurement about one creature and should cite where it came from.
# armor_rating = 60
# Placed relative to the player's arrival point rather than at an absolute coordinate,
# because the player's arrival point differs per map and this enemy is meant to be
# reachable in whichever one is loaded.
offset_x = 300.0
offset_y = 0.0
enabled = true
# Burrowing: the Plague Worm cycle, off by default. See [spawn.test_enemy.burrow].
burrow = false
burrow_out_seconds = 5.0
burrow_hidden_seconds = 4.0

[spawn.test_enemy.provenance]
source = "invented"
verified = ""
note = """
Ours, chosen rather than observed, and the row says so. There is no evidence that
anything stands 300 units east of the arrival point in any Guild Wars map. This exists
so that a hostile body can be hit, killed and revived on demand -- studies/enemy
records the repeatable cycle it supports.

`agent_id = 10` and `definition = 3` are allocator choices, not facts about the game.
studies/enemy/PLAN.md section 7.2 asks for a real agent table with allocated ids; when
that lands these two fields stop being constants and this row keeps only the placement.

max_health 100 is a placeholder matching the player's, so that damage arithmetic is
easy to read by eye during a fight. Absolute monster health is server-only data
(PLAN.md section 1.7) and nothing here has measured a Hatcher's.

BURROWING, added 2026-08-10, and the split of what is measured from what is chosen
matters more than the numbers.

`burrow_out_seconds` and `burrow_hidden_seconds` are INVENTED, like the rest of this
row, and they are the honest part of a mechanic whose other half is not. Live, these
are NOT periods: a Plague Worm stayed out 0.48-7.48 s (median 1.46) and hidden 1.6-6.9 s,
and two families sharing one model ran ~8-10 s and ~33 s cycles with distance from the
player failing to explain the split. 5.0 and 4.0 sit inside the observed ranges and are
otherwise ours. Do not read them as the game's.

The two numbers that ARE measured -- 2.00 s to emerge and 2.00 s to submerge, over 140
worm creates, with every sample inside +/-40 ms (emerge n=137 in [1.976, 2.021],
submerge n=132 in [1.973, 2.037]; the two n differ because a capture starts and ends
mid-cycle) -- deliberately did NOT come here. They are not
authorable: they are how long ArenaNet's server holds the transition effect bit before
and after the create/remove, which is protocol timing rather than a fact about this
particular creature, and this file's own header calls moving that kind of value here a
category error. They live in authsrv.py beside the opcode constants, cited.

A Hatcher is standing in for a worm. Nothing in Guild Wars says a collector burrows;
this row exercises the CYCLE, not the creature. The real worms' definition (1442, file
116366) was observed in our live capture and is deliberately not transcribed here --
importing an ArenaNet creature into tracked content is a judgement for the owner, and
the cycle is testable without it.
"""

# ------------------------------------------------- what a skill's scale MEANS
#
# THE CLIENT'S TABLE DOES NOT SAY. `scale0`/`scale15` is a generic magnitude
# pair; nothing in the 164-byte record marks it as damage, healing or a health
# bonus, and `type_code` is the skill's TYPE (spell/stance/shout/attack), which
# does not discriminate either -- a Spell can heal or harm.
#
# Reading the endpoints as damage would have been an invention wearing a
# measurement's clothes, and a bad one: three of the four skills on our own
# enemy's bar are NOT damage. The enemy would have "damaged" the player with a
# heal for 10-70 and an enchantment for 40-200.
#
# So the magnitude is measured and the MEANING is sourced here, from GWW's own
# `{{Skill progression}}` variable names -- the wiki's word, quoted verbatim,
# not our classification. Ids are the client's; every row's number was checked
# against the client table and matches endpoint for endpoint.
#
# `toolkit/authsrv/authsrv.py` models only the labels it names in
# SCALE_MEANS_DAMAGE. Everything else lands as "no modelled effect" and says so
# in the log rather than being quietly treated as damage.

# ---------------------------------------------------------------------------
# R4b'S NINE EXEMPLARS, added 2026-08-20.
#
# PLAN.md 3.2 grades R4b as "n of 9": one named skill id per `type_code` family
# Pre-Searing reaches. These are the rows that let the server resolve them. All
# eight progressions below were read from GWW in one pass on 2026-08-20 and
# **all eight agree with the client's own endpoints**, which is worth stating as
# a number because two of them agree in a way that could not be luck:
#
#   * Sever Artery -- GWW gives ONE variable, `Bleeding` 5..25, and the client
#     carries 5..25 in the BONUS slot with `skill_arguments = 4` (bonus only).
#     The bitfield said which slot before the wiki was read.
#   * Faintheartedness -- GWW gives TWO, `Duration` 3..16 and `Health
#     degeneration` 0..3, and the client carries 3..16 in the duration slot and
#     0..3 in the bonus slot with `skill_arguments = 5` (duration | bonus). Two
#     variables, two enabled bits, two matching pairs, and the SCALE slot's 50
#     sits there with its bit clear -- the "you attack 50% slower" from the
#     description, which is not a progression.
#
# That is the wiki and the client agreeing on WHICH SLOT as well as on the
# numbers, from sources that share no author or ancestry.

