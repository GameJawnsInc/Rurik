# The first profession named by OUR OWN text, not by a borrowed ArenaNet string.
#
# `ritualist-demo.toml` could only NAME the profession things the client already
# ships strings for -- it borrows attribute names, and says so. This one points at
# string ids 100352 and 100353, which live in archive text file 98: the spare file
# ArenaNet ships as 1,024 EMPTY records (studies/profession/RESKIN.md 15).
#
# Those ids are ours because we WROTE them. The route, all four steps measured:
#
#   1. `textrec.encode_file` builds the file. Its empty output is BYTE-IDENTICAL
#      to ArenaNet's own row 8295 (6,146 B), which is the check that says the
#      encoder is right before anything is written.
#   2. `datmove` relocates row 8295 (56 B compressed -> 6,172 B stored), journalled,
#      byte-for-byte revertible. `datcheck --preflight` then clears 10 of 10 of the
#      client's own open-time rules.
#   3. This recipe repoints the name and abbrev tables at the authored ids.
#   4. One caged run reads them back off the screen.
#
# STILL NO ArenaNet TEXT IN THIS REPO. Every value here is a number, and the two
# strings live in the owner's own archive copy, written by us. The id -> record map
# is arithmetic: id = file_index * 1024 + record, so file 98 starts at 100352.
#
# THE ABBREV DONOR IS TWO CHARACTERS ON PURPOSE. RESKIN.md 18.14 measured what
# happens otherwise: the "abbrev" table is a STRING ID, not a length-limited field,
# so a long donor renders in full and overflows the space a code like `W` or `Rt`
# occupies. ArenaNet's own entries are short; ours should be too.

[profession]
host   = 8        # Ritualist -- stays legal, so no bound check can ever fire
name   = 100352   # text file 98, record 0 -- authored
abbrev = 100353   # text file 98, record 1 -- authored, two characters

# All five attribute names are AUTHORED too, in the same text file: records 2-6,
# ids 100354..100358. Profession 8 owns 32, 33, 34 and 36 (36 carries the primary
# marker 'P'), and 26 is the spare claimed off the reserved profession 11 -- so
# these five rows are the whole attribute set the Skills panel derives.
#
# THE PRIMARY IS MOVED OFF THE HOST. Ritualist's own primary is 36 (Spawning
# Power); this design puts it on 26 -- the row claimed off the reserved
# profession 11 -- so the primary attribute belongs to OUR profession rather than
# being inherited. Both rows are named here because the verb is SYMMETRIC: a
# profession has exactly one primary, so setting 26 must clear 36 or the client
# ships a state it never ships itself.
#
# WHAT THIS DOES NOT BUY, and it is worth writing down: the primary attribute's
# INHERENT PASSIVE. WIKI (GWW, "Attribute" section List of attributes): every
# primary carries an effect beyond its skills -- Strength adds armor penetration,
# Energy Storage adds maximum energy, Soul Reaping gives energy on a nearby
# death. Moving the marker moves the marker. Whether a CUSTOM passive is possible
# is a separate question, under investigation.
[[attribute]]
id      = 36      # the host's OLD primary -- marker cleared below by 26 claiming it
name    = 100354  # authored
primary = 0

[[attribute]]
id      = 26      # a spare row on the reserved profession 11
owner   = 8       # claim it -- the panel derives from this
name    = 100355  # authored
primary = 1       # THE PRIMARY IS OURS, not the host's

[[attribute]]
id   = 32
name = 100356     # authored

[[attribute]]
id   = 33
name = 100357     # authored

[[attribute]]
id   = 34
name = 100358     # authored

[[skill]]
id        = 317
attribute = 26

[[skill]]
id        = 318
attribute = 26
